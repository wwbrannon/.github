name: Claude review

# Reviews this repository's own pull requests, with the criteria in
# .github/claude-review/prompt.md, using its own reusable workflow -- called
# at @main, not as a local `./` call. A local call would run the workflow and
# its actions from the pull request's commit (job.workflow_sha), so a change to
# the review engine would review itself; at @main it gets the engine every
# caller gets once it merges, as the criteria are always main's. (ci.yml calls
# the security workflow locally on purpose: there, the point is to test the
# change.) The one mutable reference in this repository, and it is to itself.
#
# OFF until the repository variable CLAUDE_REVIEW_ENABLED is "true", with a
# credential in place first, as the README describes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.CLAUDE_REVIEW_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: wwbrannon/.github/.github/workflows/reusable-claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
