name: Security (reusable)

# A secret scan of the repository's whole history (gitleaks) and a lint of its
# workflows (actionlint, with shellcheck over every run: block). Nothing here is
# specific to one repository; call it on push to the default branch and on
# pull_request.
#
# Both tools are pinned by tag and digest in install-tools' own Dockerfile,
# which Dependabot keeps current, and installed from those images -- not from
# the caller's pins, so a repository with none needs nothing to use this.

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          space-separated runner labels actionlint doesn't know (self-hosted or
          larger runners), the one thing a repository's own actionlint config
          was for
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Full history, and all of it scanned: a secret committed and then
      # deleted is still in the repository for anyone who clones it. The whole
      # history takes well under a second, so there's no case for working out
      # just the PR's commit range.
      #
      # But only history reachable from HEAD -- on a PR the merge commit, so
      # main plus the PR; on a push, main. Left to itself gitleaks scans every
      # ref, and fetch-depth: 0 fetches every branch, so one branch's finding
      # would fail every other branch's PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This workflow's own repository, at the commit the caller pinned, so
      # the actions below are exactly the ones that commit holds: a caller pins
      # one SHA, and the workflow and its actions can't drift apart. The two
      # values are checked first because, were either empty, checkout would
      # quietly fall back to the caller's repository and run its actions.
      - name: Find the shared actions
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty; can't tell which actions to run"
            exit 1
          fi
          echo "shared actions: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: ./.shared/.github/actions/install-tools
        with:
          tools: gitleaks
      # Default rules, no exemptions. gitleaks would otherwise take a
      # .gitleaks.toml or .gitleaksignore from the checkout, and honour inline
      # `gitleaks:allow` comments, so a PR could exempt its own secret. A
      # false positive gets fixed in the history instead.
      - name: Scan for secrets
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then
              echo "::error file=$f::$f would exempt findings from the secret scan; remove it"
              exit 1
            fi
          done
          gitleaks git --redact --verbose --log-opts=HEAD --ignore-gitleaks-allow .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow's own repository, at the commit the caller pinned, so
      # the actions below are exactly the ones that commit holds: a caller pins
      # one SHA, and the workflow and its actions can't drift apart. The two
      # values are checked first because, were either empty, checkout would
      # quietly fall back to the caller's repository and run its actions.
      - name: Find the shared actions
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty; can't tell which actions to run"
            exit 1
          fi
          echo "shared actions: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      # shellcheck too: actionlint runs it over every `run:` block when it
      # finds it on PATH, and that is where most of what it catches comes
      # from. Pinned like actionlint, so a runner image update can't change
      # what passes; install-tools puts both ahead of the runner's on PATH.
      - uses: ./.shared/.github/actions/install-tools
        with:
          tools: actionlint shellcheck
      # Shared rules, no exemptions -- as for gitleaks. Left to themselves,
      # actionlint reads .github/actionlint.y*ml and shellcheck reads
      # .shellcheckrc from the checkout, which on a pull request is the change
      # under review, so a PR could switch off the check that gates it. So
      # the checkout may have neither, and actionlint gets this repository's
      # config, at the commit the caller pinned. An inline
      # `# shellcheck disable=` stays possible, but it sits in the diff next
      # to what it silences.
      #
      # A caller that runs on self-hosted or larger runners names their
      # labels in the runner-labels input instead, in its calling workflow:
      # plain names only, added to a copy of the shared config, so the input
      # can declare labels but never ignore a finding.
      - name: Lint workflows
        env:
          RUNNER_LABELS: ${{ inputs.runner-labels }}
        run: |
          found=$(find . -path ./.shared -prune -o -path ./.git -prune -o \
            \( -name .shellcheckrc -o -name shellcheckrc -o -path ./.github/actionlint.yaml -o -path ./.github/actionlint.yml \) -print)
          if [ -n "$found" ]; then
            while read -r f; do
              echo "::error file=${f#./}::${f#./} would change what the workflow lint checks; remove it"
            done <<<"$found"
            exit 1
          fi
          test "$(command -v shellcheck)" = "$RUNNER_TEMP/tools/shellcheck" \
            || { echo "shellcheck isn't the pinned one: $(command -v shellcheck)" >&2; exit 1; }
          config="$RUNNER_TEMP/actionlint.yaml"
          cp .shared/.github/security/actionlint.yaml "$config"
          read -rd "" -a labels <<<"$RUNNER_LABELS" || true  # every line, not just the first
          if [ "${#labels[@]}" -gt 0 ]; then
            printf 'self-hosted-runner:\n  labels:\n' >> "$config"
            for label in "${labels[@]}"; do
              [[ $label =~ ^[A-Za-z0-9._-]+$ ]] \
                || { echo "::error::runner label '$label' isn't a plain name"; exit 1; }
              printf '    - %s\n' "$label" >> "$config"
            done
          fi
          actionlint -color -config-file "$config"
