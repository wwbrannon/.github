name: Install cosign
description: Install a pinned, checksummed cosign release binary for the runner's architecture

# The pins, and why cosign is pinned this way rather than as an image, are in
# install-cosign.sh beside this file. The inputs override them; left empty, the
# script's defaults apply.
inputs:
  version:
    description: cosign version to install (default the script's pin)
    default: ""
  sha256-amd64:
    description: SHA-256 of that version's cosign-linux-amd64
    default: ""
  sha256-arm64:
    description: SHA-256 of that version's cosign-linux-arm64
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.version }}
        COSIGN_SHA256_AMD64: ${{ inputs.sha256-amd64 }}
        COSIGN_SHA256_ARM64: ${{ inputs.sha256-arm64 }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/install-cosign.sh"
